<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Suivi des commandes</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/2.44.0/tabler-icons.min.css">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap');
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Inter', sans-serif;
    background: #0C0C13;
    color: #EDEDF5;
    min-height: 100vh;
  }
  .dtt-display { font-family: 'Space Grotesk', sans-serif; }
  .dtt-mono { font-family: 'JetBrains Mono', monospace; }
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-thumb { background: #2E2E42; border-radius: 3px; }
  .dtt-btn { cursor: pointer; border: none; transition: transform .1s, background .15s; }
  .dtt-btn:active { transform: scale(0.97); }
  .dtt-input {
    font-family: 'Inter', sans-serif;
    background: #171722;
    border: 1px solid #2A2A3D;
    color: #EDEDF5;
    border-radius: 8px;
    padding: 9px 10px;
    font-size: 13px;
    outline: none;
    width: 100%;
  }
  .dtt-input:focus { border-color: #6C5CE7; }
  .dtt-input::placeholder { color: #6B6B84; }
  .dtt-col { background: #131320; border-radius: 12px; padding: 12px; min-width: 240px; display: flex; flex-direction: column; }
  .dtt-card { background: #1B1B29; border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; cursor: default; }
  .dtt-card:last-child { margin-bottom: 0; }
</style>
</head>
<body>

<div style="max-width: 1600px; margin: 0 auto; padding: 28px 32px;">

  <div style="display:flex; align-items:baseline; justify-content:space-between; margin-bottom:20px; flex-wrap:wrap; gap:8px;">
    <h1 class="dtt-display" style="margin:0; font-size:24px; font-weight:600; letter-spacing:-0.01em;">Suivi des commandes</h1>
    <span id="dtt-sync" style="font-size:11px; color:#6B6B84;">chargement...</span>
  </div>

  <div style="display:flex; align-items:center; gap:8px; margin-bottom:10px;">
    <label for="dtt-threshold" style="font-size:11px; color:#6B6B84;">Alerte "plus ancien" si en attente depuis plus de</label>
    <input type="number" id="dtt-threshold" min="0" step="1" style="width:52px; background:#171722; border:1px solid #2A2A3D; color:#EDEDF5; border-radius:6px; padding:4px 6px; font-size:12px; text-align:center;" />
    <span style="font-size:11px; color:#6B6B84;">jour(s)</span>
  </div>

  <div id="dtt-oldest" style="display:none; align-items:center; gap:10px; background:#241417; border-left:3px solid #FF5C77; border-radius:0 8px 8px 0; padding:10px 14px; margin-bottom:18px;">
    <i class="ti ti-alert-triangle" style="font-size:18px; color:#FF9B9B;" aria-hidden="true"></i>
    <div style="flex:1; min-width:0;">
      <div style="font-size:12px; color:#FF9B9B; font-weight:500;">En attente depuis le plus longtemps</div>
      <div id="dtt-oldest-text" style="font-size:13px; color:#EDEDF5; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;"></div>
    </div>
  </div>

  <div id="dtt-stats" style="display:grid; grid-template-columns:repeat(6,minmax(0,1fr)); gap:10px; margin-bottom:20px;"></div>

  <div style="background:#131320; border-radius:12px; padding:16px; margin-bottom:22px;">
    <div style="font-size:13px; font-weight:500; margin-bottom:10px; color:#C7C7D9;">Nouvelle commande</div>
    <div style="display:grid; grid-template-columns:1.3fr 1fr 1fr; gap:8px; margin-bottom:8px;">
      <input class="dtt-input" id="dtt-title" placeholder="Numéro ticket" />
      <input class="dtt-input" id="dtt-requester" placeholder="Client (pseudo)" />
      <input class="dtt-input" id="dtt-assignee" placeholder="Assigné à (optionnel)" />
    </div>
    <div style="display:grid; grid-template-columns:1fr 1fr auto; gap:8px;">
      <select class="dtt-input" id="dtt-priority">
        <option value="normal">Priorité normale</option>
        <option value="urgent">Urgent</option>
        <option value="low">Faible</option>
      </select>
      <select class="dtt-input" id="dtt-status"></select>
      <button class="dtt-btn" id="dtt-add" style="background:#6C5CE7; color:#F2F0FF; border-radius:8px; padding:9px 20px; font-size:13px; font-weight:500; white-space:nowrap;">
        <i class="ti ti-plus" style="font-size:15px; vertical-align:-2px; margin-right:4px;" aria-hidden="true"></i>Créer
      </button>
    </div>
  </div>

  <div style="display:flex; gap:8px; margin-bottom:14px; align-items:center;">
    <select class="dtt-input" id="dtt-filter-priority" style="width:auto; font-size:12px; padding:6px 8px;">
      <option value="all">Toutes priorités</option>
      <option value="urgent">Urgent</option>
      <option value="normal">Normal</option>
      <option value="low">Faible</option>
    </select>
    <span style="margin-left:auto; font-size:11px; color:#6B6B84;">Trié par ancienneté dans chaque colonne</span>
  </div>

  <div id="dtt-board" style="display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:12px; align-items:start;"></div>

  <button class="dtt-btn" id="dtt-archive-toggle" style="background:transparent; border:1px solid #2A2A3D; color:#9797AC; border-radius:8px; padding:8px 14px; font-size:12px; margin-top:18px;">
    <i class="ti ti-archive" style="font-size:14px; vertical-align:-2px; margin-right:6px;" aria-hidden="true"></i>
    <span id="dtt-archive-label">Voir les commandes validées (0)</span>
  </button>
  <div id="dtt-archive-list" style="display:none; margin-top:12px; background:#131320; border-radius:12px; padding:12px;"></div>

</div>

<script>
(function() {
  const STATUSES = [
    { id: 'commande',  label: 'Attente commande',  bg:'#2E1418', text:'#FF9B9B', alertHours: 7 * 24 },
    { id: 'reception', label: 'Attente réception',  bg:'#2E2410', text:'#FFC978', alertHours: 7 * 24 },
    { id: 'boxing',    label: 'Attente boxing',     bg:'#12233A', text:'#8FC1F7', alertHours: 2 * 24 },
    { id: 'boxe',      label: 'Boxé',               bg:'#0F2A28', text:'#7DE0D3', alertHours: 15 * 24 },
    { id: 'paiement',  label: 'Attente paiement',   bg:'#2A1230', text:'#E3A6F7', alertHours: 2 * 24 },
    { id: 'valide',    label: 'Validé',             bg:'#17301A', text:'#9FE08E', alertHours: null }
  ];
  const ACTIVE_STATUSES = STATUSES.filter(s => s.id !== 'valide');
  const priorityStyle = {
    urgent:  { bg:'#2E1418', text:'#FF9B9B', label:'Urgent' },
    normal:  { bg:'#2E2410', text:'#FFC978', label:'Normal' },
    low:     { bg:'#0F2A28', text:'#7DE0D3', label:'Faible' }
  };

  const KEY = 'tickets';
  let tickets = [];

  function statusOf(id) { return STATUSES.find(s => s.id === id); }

  function ageText(ts) {
    const mins = Math.floor((Date.now() - ts) / 60000);
    if (mins < 60) return mins + ' min';
    const hrs = Math.floor(mins / 60);
    if (hrs < 24) return hrs + ' h';
    return Math.floor(hrs / 24) + ' j';
  }

  function ageColor(t) {
    const s = statusOf(t.status);
    const hrs = (Date.now() - t.createdAt) / 3600000;
    if (!s.alertHours) return '#9797AC';
    if (hrs >= s.alertHours) return '#FF9B9B';
    if (hrs >= s.alertHours * 0.6) return '#FFC978';
    return '#9797AC';
  }

  function isOverdue(t) {
    const s = statusOf(t.status);
    if (!s.alertHours) return false;
    return (Date.now() - t.createdAt) / 3600000 >= s.alertHours;
  }

  function escapeHtml(str) {
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }

  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      tickets = raw ? JSON.parse(raw) : [];
    } catch (e) {
      tickets = [];
    }
    document.getElementById('dtt-sync').textContent = 'stocké sur cet appareil';
    render();
  }

  function save() {
    try {
      localStorage.setItem(KEY, JSON.stringify(tickets));
    } catch (e) {
      document.getElementById('dtt-sync').textContent = 'erreur de sauvegarde';
    }
  }

  function addTicket() {
    const title = document.getElementById('dtt-title').value.trim();
    const requester = document.getElementById('dtt-requester').value.trim();
    if (!title || !requester) return;
    const priority = document.getElementById('dtt-priority').value;
    const status = document.getElementById('dtt-status').value;
    const assignee = document.getElementById('dtt-assignee').value.trim();

    tickets.push({
      id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
      title, requester, priority, assignee,
      status,
      createdAt: Date.now()
    });

    document.getElementById('dtt-title').value = '';
    document.getElementById('dtt-requester').value = '';
    document.getElementById('dtt-assignee').value = '';
    save();
    render();
  }

  function setStatus(id, status) {
    const t = tickets.find(x => x.id === id);
    if (!t) return;
    if (status === 'valide') {
      const amountInput = window.prompt('Montant de la commande (€) pour ' + t.title, t.amount != null ? t.amount : '');
      if (amountInput === null) return;
      const commissionInput = window.prompt('Montant de la commission prise (€) pour ' + t.title, t.commission != null ? t.commission : '');
      if (commissionInput === null) return;
      t.amount = Math.round(parseFloat(amountInput.replace(',', '.')) * 100) / 100 || 0;
      t.commission = Math.round(parseFloat(commissionInput.replace(',', '.')) * 100) / 100 || 0;
    }
    t.status = status;
    save();
    render();
  }

  function editAmounts(id) {
    const t = tickets.find(x => x.id === id);
    if (!t) return;
    const amountInput = window.prompt('Montant de la commande (€) pour ' + t.title, t.amount != null ? t.amount : '');
    if (amountInput === null) return;
    const commissionInput = window.prompt('Montant de la commission prise (€) pour ' + t.title, t.commission != null ? t.commission : '');
    if (commissionInput === null) return;
    t.amount = Math.round(parseFloat(amountInput.replace(',', '.')) * 100) / 100 || 0;
    t.commission = Math.round(parseFloat(commissionInput.replace(',', '.')) * 100) / 100 || 0;
    save();
    render();
  }

  function removeTicket(id) {
    tickets = tickets.filter(x => x.id !== id);
    save();
    render();
  }

  function initStatusSelect() {
    const sel = document.getElementById('dtt-status');
    sel.innerHTML = STATUSES.map(s => '<option value="' + s.id + '">' + s.label + '</option>').join('');
  }

  function renderStats() {
    const box = document.getElementById('dtt-stats');
    box.innerHTML = STATUSES.map(s => {
      const count = tickets.filter(t => t.status === s.id).length;
      return '<div style="background:#131320; border-radius:10px; padding:12px;">' +
        '<div style="font-size:11px; color:#9797AC; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">' + s.label + '</div>' +
        '<div class="dtt-display" style="font-size:22px; font-weight:600; color:' + s.text + ';">' + count + '</div>' +
        '</div>';
    }).join('');
  }

  const THRESHOLD_KEY = 'oldestThresholdDays';
  let oldestThresholdDays = 2;

  function loadThreshold() {
    const raw = localStorage.getItem(THRESHOLD_KEY);
    oldestThresholdDays = raw !== null && raw !== '' ? Number(raw) : 2;
    document.getElementById('dtt-threshold').value = oldestThresholdDays;
  }

  function saveThreshold(val) {
    oldestThresholdDays = Number(val) || 0;
    localStorage.setItem(THRESHOLD_KEY, oldestThresholdDays);
    renderOldest();
  }

  function renderOldest() {
    const box = document.getElementById('dtt-oldest');
    const active = tickets.filter(t => t.status !== 'valide');
    if (active.length) {
      const oldest = active.reduce((a, b) => a.createdAt < b.createdAt ? a : b);
      const days = (Date.now() - oldest.createdAt) / 86400000;
      if (days >= oldestThresholdDays) {
        box.style.display = 'flex';
        document.getElementById('dtt-oldest-text').textContent =
          oldest.title + ' — ' + oldest.requester + ' · ' + statusOf(oldest.status).label + ' (' + ageText(oldest.createdAt) + ')';
      } else {
        box.style.display = 'none';
      }
    } else {
      box.style.display = 'none';
    }
  }

  function cardHtml(t) {
    const p = priorityStyle[t.priority];
    const overdue = isOverdue(t);
    const border = overdue ? 'border-left:3px solid #FF5C77;' : 'border-left:3px solid transparent;';
    return '<div class="dtt-card" style="' + border + '">' +
      '<div style="display:flex; align-items:center; gap:6px; margin-bottom:4px;">' +
        (overdue ? '<i class="ti ti-flame" style="font-size:13px; color:#FF9B9B;" aria-hidden="true"></i>' : '') +
        '<span class="dtt-mono" style="font-size:13px; font-weight:500; overflow-wrap:break-word;">' + escapeHtml(t.title) + '</span>' +
      '</div>' +
      '<div style="font-size:11px; color:#8A8A9E; margin-bottom:8px;">' + escapeHtml(t.requester) +
        (t.assignee ? ' &middot; ' + escapeHtml(t.assignee) : '') + '</div>' +
      '<div style="display:flex; align-items:center; justify-content:space-between; gap:6px;">' +
        '<span style="font-size:10px; padding:2px 7px; border-radius:5px; background:' + p.bg + '; color:' + p.text + ';">' + p.label + '</span>' +
        '<span class="dtt-mono" style="font-size:11px; font-weight:500; color:' + ageColor(t) + ';">' + ageText(t.createdAt) + '</span>' +
      '</div>' +
      '<div style="display:flex; gap:6px; margin-top:8px;">' +
        '<select data-id="' + t.id + '" class="dtt-move dtt-input" style="font-size:11px; padding:5px 6px;">' +
          STATUSES.map(s => '<option value="' + s.id + '" ' + (t.status===s.id?'selected':'') + '>' + s.label + '</option>').join('') +
        '</select>' +
        '<button data-id="' + t.id + '" class="dtt-btn dtt-remove" style="background:transparent; padding:5px 8px; border-radius:6px; color:#6B6B84;" aria-label="Supprimer">' +
          '<i class="ti ti-trash" style="font-size:14px;" aria-hidden="true"></i>' +
        '</button>' +
      '</div>' +
    '</div>';
  }

  function renderBoard() {
    const filterPriority = document.getElementById('dtt-filter-priority').value;
    const board = document.getElementById('dtt-board');
    board.innerHTML = ACTIVE_STATUSES.map(s => {
      let colTickets = tickets.filter(t => t.status === s.id &&
        (filterPriority === 'all' || t.priority === filterPriority));
      colTickets.sort((a, b) => a.createdAt - b.createdAt);
      const cards = colTickets.length
        ? colTickets.map(cardHtml).join('')
        : '<div style="text-align:center; padding:20px 0; color:#4E4E64; font-size:12px;">Vide</div>';
      return '<div class="dtt-col">' +
        '<div style="display:flex; align-items:center; gap:6px; margin-bottom:10px;">' +
          '<span style="width:8px; height:8px; border-radius:50%; background:' + s.text + ';"></span>' +
          '<span style="font-size:12px; font-weight:500; color:' + s.text + ';">' + s.label + '</span>' +
        '</div>' +
        cards +
      '</div>';
    }).join('');

    board.querySelectorAll('.dtt-move').forEach(sel => {
      sel.addEventListener('change', e => setStatus(e.target.dataset.id, e.target.value));
    });
    board.querySelectorAll('.dtt-remove').forEach(btn => {
      btn.addEventListener('click', e => removeTicket(e.currentTarget.dataset.id));
    });
  }

  function renderArchive() {
    const done = tickets.filter(t => t.status === 'valide').sort((a, b) => b.createdAt - a.createdAt);
    document.getElementById('dtt-archive-label').textContent = 'Voir les commandes validées (' + done.length + ')';
    const totalCommission = done.reduce((s, t) => s + (t.commission || 0), 0);
    const list = document.getElementById('dtt-archive-list');
    const header = '<div style="display:flex; justify-content:space-between; align-items:center; padding:0 4px 10px; border-bottom:1px solid #1F1F2E; margin-bottom:6px;">' +
      '<span style="font-size:12px; color:#9797AC;">Total commissions</span>' +
      '<span class="dtt-display" style="font-size:16px; font-weight:600; color:#9FE08E;">' + totalCommission.toFixed(2) + ' €</span>' +
    '</div>';
    const rows = done.length
      ? done.map(t =>
          '<div style="display:flex; align-items:center; justify-content:space-between; gap:10px; padding:8px 4px; border-bottom:1px solid #1F1F2E;">' +
            '<span class="dtt-mono" style="font-size:12px; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">' + escapeHtml(t.title) + '</span>' +
            '<span style="font-size:11px; color:#8A8A9E; white-space:nowrap;">' + escapeHtml(t.requester) + '</span>' +
            '<span class="dtt-mono" style="font-size:12px; white-space:nowrap;">' + (t.amount || 0).toFixed(2) + ' €</span>' +
            '<span class="dtt-mono" style="font-size:12px; color:#9FE08E; white-space:nowrap;">+' + (t.commission || 0).toFixed(2) + ' €</span>' +
            '<button data-id="' + t.id + '" class="dtt-btn dtt-edit-archived" style="background:transparent; padding:4px 6px; color:#6B6B84;" aria-label="Modifier"><i class="ti ti-edit" style="font-size:13px;" aria-hidden="true"></i></button>' +
            '<button data-id="' + t.id + '" class="dtt-btn dtt-remove-archived" style="background:transparent; padding:4px 6px; color:#6B6B84;" aria-label="Supprimer"><i class="ti ti-trash" style="font-size:13px;" aria-hidden="true"></i></button>' +
          '</div>'
        ).join('')
      : '<div style="text-align:center; padding:12px 0; color:#4E4E64; font-size:12px;">Aucune commande validée.</div>';
    list.innerHTML = header + rows;
    list.querySelectorAll('.dtt-remove-archived').forEach(btn => {
      btn.addEventListener('click', e => removeTicket(e.currentTarget.dataset.id));
    });
    list.querySelectorAll('.dtt-edit-archived').forEach(btn => {
      btn.addEventListener('click', e => editAmounts(e.currentTarget.dataset.id));
    });
  }

  function render() {
    renderStats();
    renderOldest();
    renderBoard();
    renderArchive();
  }

  initStatusSelect();
  loadThreshold();
  document.getElementById('dtt-add').addEventListener('click', addTicket);
  document.getElementById('dtt-filter-priority').addEventListener('change', renderBoard);
  document.getElementById('dtt-threshold').addEventListener('change', e => saveThreshold(e.target.value));
  document.getElementById('dtt-archive-toggle').addEventListener('click', () => {
    const list = document.getElementById('dtt-archive-list');
    list.style.display = list.style.display === 'none' ? 'block' : 'none';
  });
  setInterval(render, 60000);

  load();
})();
</script>
</body>
</html>
